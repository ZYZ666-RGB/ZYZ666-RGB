name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Built-in themes are written to profile-3d-contrib/.
      # The profile shows the official night-green theme only.
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: push 3d contribution calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-green.svg
          if git diff --staged --quiet; then
            echo "3D contribution calendar unchanged."
            exit 0
          fi
          git commit -m "chore: refresh 3d contribution calendar"
          git push
