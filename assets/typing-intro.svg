<svg xmlns="http://www.w3.org/2000/svg" width="680" height="55" viewBox="0 0 680 55" role="img" aria-labelledby="intro-title intro-desc">
<title id="intro-title">Welcome to yuzhou's corner</title>
<desc id="intro-desc">A looping typewriter introduction. Hi, I'm yuzhou. Welcome aboard. Turning curiosity into code. Building agents, one step at a time. Keep learning. Keep moving forward. Types each line, pauses, deletes it, then moves to the next. A still greeting is shown when reduced motion is preferred.</desc>
